;;; duui-coh-metrix: ClearNLP (spaCy English) -> Stanford Dependencies, before stan2uni.ini (DepEdit, Peng & Zeldes 2018).
;;; stan2uni.ini converts Stanford Dependencies (SD) to UD. ClearNLP differs from SD in the labels below; these rules bring
;;; them to the SD form stan2uni.ini expects. Our operationalisation (Coh-Metrix best effort, README "Best effort without UD").

;existential "there is X": X is the subject (UD and SD), ClearNLP labels it attr
func=/^expl$/;lemma=/^be$/;func=/^attr$/	#2>#1;#2>#3	#3:func=nsubj

;copula with a nominal or adjectival predicate: ClearNLP makes "be" the head (attr, acomp), SD and UD the predicate
lemma=/^be$/&func=/^root$/;func=/^(attr|acomp)$/	#1>#2	#2:head=0;#2:func=root;#2>#1;#1:func=cop;#2:morph=COPHEAD
text=/.*/;lemma=/^be$/&func=/(.*)/;func=/^(attr|acomp)$/	#1>#2;#2>#3	#1>#3;#3:func=$1;#3>#2;#2:func=cop;#3:morph=COPHEAD
;the other dependents of the copula (subject, auxiliaries, negation, punctuation ...) go to the predicate
morph=/COPHEAD/;func=/^cop$/;func=/.*/	#1>#2;#2>#3	#1>#3
morph=/COPHEAD/	none	#1:morph=_

;relative clause: SD rcmod (stan2uni.ini: acl:relcl)
func=/^relcl$/	none	#1:func=rcmod
;object predicate
func=/^oprd$/	none	#1:func=xcomp
;remaining attr (predicate of a verb other than "be", e.g. "become"): xcomp
func=/^attr$/	none	#1:func=xcomp
;dative: a preposition (to, for) is an SD prep with its pobj, a nominal the indirect object
cpos=/^(IN|TO)$/&func=/^dative$/	none	#1:func=prep
func=/^dative$/	none	#1:func=iobj
;agent: the "by" of a passive with its pobj: by -> case, the noun -> obl:agent
func=/.*/;func=/^agent$/;func=/^pobj$/	#1>#2>#3	#3>#2;#2:func=case;#3:func=obl:agent;#1>#3
func=/^agent$/	none	#1:func=case
